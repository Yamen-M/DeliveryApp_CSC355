<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Restaurant Login</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <h1>Restaurant Login</h1>
      <div class="role-options" aria-label="Login options">
        <a class="role-option" href="/login">Customer</a>
        <span class="role-option active">Restaurant</span>
        <a class="role-option" href="/courrier/login">Courrier</a>
      </div>
      <form method="POST" action="/restaurant/login">
        <label>
          Restaurant Name:
          <input placeholder="e.g. Pizza Palace" type="text" name="restaurantName" required />
        </label>
        <label>
          Password:
          <input placeholder="Password" type="password" name="password" required />
        </label>
        <button type="submit">Log in</button>
      </form>
      <p class="auth-switch">
        New restaurant? <a href="/restaurant/register">Register</a>
      </p>
    </main>
  </body>
</html>
