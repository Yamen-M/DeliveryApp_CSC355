<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Order #{{orderId}}</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <nav>
      <span class="brand">Deliveroo</span>
      <a href="/home">← Home</a>
    </nav>

    <div class="container">
      <section class="hero">
        <h1>Order #{{orderId}}</h1>
        <p>Track the status, items, and total for this order.</p>
      </section>

      <div class="card">
        <div class="card-head">
          <h2>Order Details</h2>
          <span class="badge">{{orderStatus}}</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Items</h2>
        </div>
        <ul class="item-list">
          {{orderItems}}
        </ul>
        <p class="total-price">
          Total: <span>${{totalPrice}}</span>
        </p>
      </div>

      <div class="card">
        <form method="POST" action="/order/cancel">
          <input type="hidden" name="orderId" value="{{orderId}}" />
          <button type="submit" class="danger">Cancel Order</button>
        </form>
      </div>

    </div>
  </body>
</html>
