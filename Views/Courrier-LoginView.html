<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Courrier Login</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <h1>Courrier Login</h1>
      <div class="role-options" aria-label="Login options">
        <a class="role-option" href="/login">Customer</a>
        <a class="role-option" href="/restaurant/login">Restaurant</a>
        <span class="role-option active">Courrier</span>
      </div>
      <form method="POST" action="/courrier/login">
        <label>
          Phone Number:
          <input placeholder="+1 555 000 0000" type="tel" name="phoneNumber" required />
        </label>
        <label>
          Password:
          <input placeholder="Password" type="password" name="password" required />
        </label>
        <button type="submit">Log in</button>
      </form>
      <p class="auth-switch">
        New courrier? <a href="/courrier/register">Register</a>
      </p>
    </main>
  </body>
</html>
