<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Home</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <nav>
      <span class="brand">Deliveroo</span>
      <form method="POST" action="/auth/logout">
        <button type="submit">Log out</button>
      </form>
    </nav>

    <div class="container">
      <section class="hero">
        <h1>Welcome back, <strong>{{userEmail}}</strong></h1>
        <p>Browse restaurants, check your recent orders, and keep track of active deliveries from one place.</p>
      </section>

      <div class="card">
        <div class="card-head">
          <h2>Quick Actions</h2>
        </div>
        <ul class="item-list">
          <li>
            <div class="item-main">
              <div class="item-title-row">
                <span>View My Orders</span>
              </div>
              <div class="item-meta">Open your order history and track current progress.</div>
            </div>
            <div class="item-actions">
              <a href="/orders">Open</a>
            </div>
          </li>
        </ul>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Available Restaurants</h2>
        </div>
        <ul class="item-list">
          {{restaurantList}}
        </ul>
      </div>
    </div>
  </body>
</html>
