<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — {{restaurantName}}</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <nav>
      <span class="brand">{{restaurantName}}</span>
      <a href="/home">← Back</a>
    </nav>

    <div class="container">
      <section class="hero">
        <h1>{{restaurantName}}</h1>
        <p>Select items below and add them to your cart before placing your order.</p>
      </section>

      <div class="card">
        <div class="card-head">
          <h2>Menu</h2>
        </div>
        <ul class="item-list">
          {{menuItems}}
        </ul>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Your Cart</h2>
        </div>
        <ul class="item-list">
          {{cartItems}}
        </ul>
        <p class="total-price">
          Total: <span>${{totalPrice}}</span>
        </p>
        <form method="POST" action="/order/create">
          <input type="hidden" name="restaurantId" value="{{restaurantId}}" />
          <button type="submit" {{checkoutDisabled}}>Place Order</button>
        </form>
      </div>

    </div>
  </body>
</html>
