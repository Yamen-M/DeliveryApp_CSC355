<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <h1>Welcome back</h1>
      <section>
        <div class="role-options" aria-label="Login options">
          <span class="role-option active">Customer</span>
          <a class="role-option" href="/restaurant/login">Restaurant</a>
          <a class="role-option" href="/courrier/login">Courrier</a>
        </div>

        <form method="POST" action="/auth/login">
          <label
            >Email Address:
            <input
              placeholder="Email Address"
              type="email"
              name="userEmail"
              required
            />
          </label>
          <label
            >Password:
            <input
              placeholder="Password"
              type="password"
              name="password"
              required
            />
          </label>
          <button type="submit">Log in</button>
        </form>
        <p class="auth-switch">
          No account yet? <a href="/register">Register here!</a>
        </p>
      </section>
    </main>
  </body>
</html>
