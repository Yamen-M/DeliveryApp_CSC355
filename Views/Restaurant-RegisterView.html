<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Restaurant Register</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <h1>Register your Restaurant</h1>
      <form method="POST" action="/restaurant/register">
        <label>
          Restaurant Name:
          <input placeholder="e.g. Pizza Palace" type="text" name="restaurantName" required />
        </label>
        <label>
          Password:
          <input placeholder="Password" type="password" name="password" required />
        </label>
        <button type="submit">Create Account</button>
      </form>
      <p class="auth-switch">
        Already registered? <a href="/restaurant/login">Log in</a>
      </p>
    </main>
  </body>
</html>
