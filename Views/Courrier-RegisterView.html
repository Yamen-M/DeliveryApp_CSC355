<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Courrier Register</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <h1>Join as a Courrier</h1>
      <form method="POST" action="/courrier/register">
        <label>
          Phone Number:
          <input placeholder="+1 555 000 0000" type="tel" name="phoneNumber" required />
        </label>
        <label>
          Password:
          <input placeholder="Password" type="password" name="password" required />
        </label>
        <button type="submit">Create Account</button>
      </form>
      <p class="auth-switch">
        Already registered? <a href="/courrier/login">Log in</a>
      </p>
    </main>
  </body>
</html>
